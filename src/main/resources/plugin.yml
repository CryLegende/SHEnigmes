name: SHEnigmes
version: '${project.version}'
main: org.Cry_Legende.sHEnigmes.SHEnigmes
api-version: '1.21'
author: Cry_Legende
description: Codes secrets propres à chaque joueur (séquences et mots) pour les énigmes, pilotés depuis la console.
softdepend:
  - PlaceholderAPI

commands:
  shenigmes:
    description: Commandes d'administration des énigmes (codes secrets par joueur).
    usage: /shenigmes <saisir|jouer|montrer|repondre|reset|etat|reload>
    aliases:
      - enigmes

permissions:
  shenigmes.admin:
    description: Toutes les sous-commandes de /shenigmes.
    default: op
    children:
      shenigmes.admin.saisir: true
      shenigmes.admin.jouer: true
      shenigmes.admin.montrer: true
      shenigmes.admin.repondre: true
      shenigmes.admin.reset: true
      shenigmes.admin.etat: true
      shenigmes.admin.reload: true
  shenigmes.admin.saisir:
    description: Entrer un symbole dans une séquence (/shenigmes saisir).
    default: op
  shenigmes.admin.jouer:
    description: Rejouer le code d'une séquence à un joueur (/shenigmes jouer).
    default: op
  shenigmes.admin.montrer:
    description: Montrer une pièce du mot d'un joueur (/shenigmes montrer).
    default: op
  shenigmes.admin.repondre:
    description: Proposer un mot pour un joueur (/shenigmes repondre).
    default: op
  shenigmes.admin.reset:
    description: Effacer le code d'un joueur pour tirer un nouveau code (/shenigmes reset).
    default: op
  shenigmes.admin.etat:
    description: Afficher le code, la saisie et les pièces vues d'un joueur (/shenigmes etat).
    default: op
  shenigmes.admin.reload:
    description: Recharger config.yml et messages.yml (/shenigmes reload).
    default: op
